name: Deploy UGC portfolio

on:
  push:
    branches:
      - main
    paths:
      - 'ugc/**'
      - '.github/workflows/deploy-ugc.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-ugc-production
  cancel-in-progress: true

defaults:
  run:
    working-directory: ugc

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ugc/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build UGC portfolio
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload UGC portfolio
        run: aws s3 sync dist/ s3://ugc.jesse-salinas.com --delete

      - name: Keep HTML revalidation-friendly
        run: aws s3 cp dist/index.html s3://ugc.jesse-salinas.com/index.html --cache-control "no-cache, no-store, must-revalidate" --content-type "text/html; charset=utf-8"

      - name: Invalidate UGC CloudFront distribution
        run: aws cloudfront create-invalidation --distribution-id EQ7UJH31IY14C --paths '/*'
